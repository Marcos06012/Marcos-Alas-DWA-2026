<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema interactivo de gestión y registro de libros de la biblioteca. Valida el formato del código ISBN mediante expresiones regulares.">
    <title>Gestión de Libros - Ejercicio 7</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #4f46e5;
            color: white;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            padding: 1.5rem;
        }
        .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
            transform: translateY(-1px);
        }
        .list-group-item {
            border-left: 4px solid #4f46e5;
            transition: background-color 0.2s ease;
        }
        .list-group-item:hover {
            background-color: #f9fafb;
        }
        .alert {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Título Principal de la Página -->
                <header class="text-center mb-4">
                    <h1 class="fw-bold text-dark">Gestión de Libros de Biblioteca</h1>
                    <p class="text-muted">Registre nuevos libros en el sistema y verifique su código ISBN</p>
                </header>

                <div class="row g-4">
                    <!-- Formulario de Registro -->
                    <section class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h2 class="h5 mb-0 fw-semibold">Agregar Nuevo Libro</h2>
                            </div>
                            <div class="card-body p-4">
                                <!-- Alerta de Error (Bootstrap) -->
                                <div id="divAlerta" class="alert alert-danger" role="alert">
                                    <strong>¡Error en el ISBN!</strong> El código ISBN debe tener exactamente 10 o 13 dígitos numéricos.
                                </div>

                                <form id="formLibro" novalidate>
                                    <div class="mb-3">
                                        <label for="txtTitulo" class="form-label fw-medium">Título del Libro</label>
                                        <input type="text" class="form-control" id="txtTitulo" placeholder="Ej. El Principito" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="txtAutor" class="form-label fw-medium">Autor</label>
                                        <input type="text" class="form-control" id="txtAutor" placeholder="Ej. Antoine de Saint-Exupéry" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="txtIsbn" class="form-label fw-medium">Código ISBN (10 o 13 dígitos)</label>
                                        <input type="text" class="form-control" id="txtIsbn" placeholder="Ej. 8447346123 o 9788447346123" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="txtAnio" class="form-label fw-medium">Año de Publicación</label>
                                        <input type="number" class="form-control" id="txtAnio" placeholder="Ej. 1943" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="txtGenero" class="form-label fw-medium">Género Literario</label>
                                        <input type="text" class="form-control" id="txtGenero" placeholder="Ej. Literatura infantil, Novela" required>
                                    </div>
                                    <button type="submit" id="btnAgregar" class="btn btn-primary w-100 py-2 fw-semibold">
                                        Agregar Libro
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <!-- Lista de Libros Agregados -->
                    <section class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-dark text-white">
                                <h2 class="h5 mb-0 fw-semibold">Libros Registrados</h2>
                            </div>
                            <div class="card-body p-4 d-flex flex-column">
                                <ul id="listaLibros" class="list-group list-group-flush overflow-auto flex-grow-1" style="max-height: 400px;">
                                    <li id="itemVacio" class="list-group-item text-center text-muted border-0 py-4">
                                        No hay libros registrados actualmente.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- Enlace al archivo JS -->
    <script src="ejercicio7.js"></script>
</body>
</html>
